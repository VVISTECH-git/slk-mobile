# Codemagic CI/CD for SLK Mobile (Flutter).
# ---------------------------------------------------------------------------
# Two workflows: Android (APK + AAB) and iOS (IPA → TestFlight). The app points
# at the live API by default (lib/core/config.dart → Render URL); override per
# build with --dart-define=API_BASE_URL=... if you need staging.
#
# ONE-TIME SETUP in the Codemagic UI (nothing here needs your password in the repo):
#   • Connect this GitHub repo to a Codemagic app.
#   • Android signing: Teams → Code signing identities → Android keystores →
#     upload upload-keystore.jks, and name the reference  slk_keystore
#     (alias/passwords from when the keystore was created).
#   • iOS signing: add an App Store Connect API key integration named
#     slk_app_store_connect  (Integrations → App Store Connect).
#   • Google Play (optional): add a service-account JSON, referenced below.
#   • Set a real notification email under the `publishing` blocks if wanted.
# ---------------------------------------------------------------------------

workflows:
  # =========================================================================
  # ANDROID — signed APK + AAB, ready for Google Play
  # =========================================================================
  android-workflow:
    name: Android (APK + AAB)
    # mac_mini_m2 is what the account's plan allows (same instance the other
    # VVIS apps build on). Android builds fine on macOS instances.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      android_signing:
        # Name of the Android keystore reference in Codemagic → Code signing
        # identities (this must match exactly what you named it there).
        - slk
      groups:
        # Variable group holding GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (the Play
        # service-account JSON). Create this group in Codemagic and add that var.
        - google_play
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Static analysis
        # Fail on real errors only; info/style lints don't block the build.
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Write key.properties from the Codemagic keystore
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Build APK + AAB
        script: |
          # Auto-increment build number so each upload is always higher.
          flutter build apk --release --build-number=$BUILD_NUMBER
          flutter build appbundle --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/**/outputs/apk/**/*.apk
      - build/**/outputs/bundle/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - bhanuboddu09@gmail.com
        notify:
          success: true
          failure: true
      # Auto-publish the AAB to Google Play. Requires GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      # (a Play service-account JSON) in Codemagic env, and one prior MANUAL upload
      # of this package so the app exists on Play. Change `track` to "production"
      # only once the store listing + any required closed testing are complete.
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

  # =========================================================================
  # iOS — signed IPA → TestFlight (runs on a Mac, so it works from Windows too)
  # =========================================================================
  ios-workflow:
    name: iOS (Ad Hoc)
    # Mirrors the DockMate/LEAP setup that already works on this account:
    # Codemagic-managed AUTOMATIC signing with an AD HOC distribution profile
    # (installs on registered devices; not TestFlight). Uses the same
    # "VVIS Codemagic" App Store Connect key.
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: "VVIS Codemagic" # App Store Connect API key (Key: V3NW8K9FQ9)
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - signing # must contain the secure var CERTIFICATE_PRIVATE_KEY
      vars:
        BUNDLE_ID: "com.vvistech.slkMobile"
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Static analysis
        # Fail on real errors only; info/style lints don't block the build.
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        # Reuse ONE persistent distribution certificate instead of creating a new
        # one every build. Apple caps you at 2 distribution certs, so per-build
        # creation eventually fails with a 409 ("you already have a current
        # certificate"). The private key is stored once as the secure Codemagic
        # env var CERTIFICATE_PRIVATE_KEY; fetch-signing-files finds the cert made
        # with that key and reuses it, only creating one the very first time.
        #
        # One-time setup (see repo notes):
        #   1. openssl genrsa 2048  → paste output into a SECURE env var named
        #      CERTIFICATE_PRIVATE_KEY (scope: this app / ios-workflow).
        #   2. Revoke any stale distribution certs in the Apple Developer portal
        #      so the first build has a free slot to create the reusable cert.
        script: |
          set -ex
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          echo "══ signing identities in keychain ══"
          security find-identity -v -p codesigning
          xcode-project use-profiles
      - name: Build IPA
        script: |
          # Auto-increment build number (Codemagic's ever-rising counter) so the
          # TestFlight upload is always higher than the previous one.
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - bhanuboddu09@gmail.com
        notify:
          success: true
          failure: true
      # Upload to TestFlight for INTERNAL testers (no external beta review, which
      # would require extra contact info). Internal testers can install as soon
      # as the build finishes processing.
      app_store_connect:
        auth: integration

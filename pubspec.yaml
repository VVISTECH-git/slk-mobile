name: slk_mobile
description: "Sree Lakshmi Kalamkari — inventory & billing (mobile)."
publish_to: 'none'

version: 1.3.3+52

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Secure token storage
  flutter_secure_storage: ^9.2.4

  # Theme persistence
  shared_preferences: ^2.3.3

  # Barcode / QR scanning (POS + stock)
  mobile_scanner: ^6.0.2

  # Product photos (camera + gallery)
  image_picker: ^1.1.2

  # Tax-invoice PDF + print/share
  pdf: ^3.11.1
  printing: ^5.13.4

  # On-screen QR rendering (piece detail)
  qr_flutter: ^4.1.0

  # Share a QR image to WhatsApp etc.
  share_plus: ^10.1.4
  path_provider: ^2.1.4

  # Misc UI helpers
  intl: ^0.19.0
  camera: ^0.12.0+2
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Icon + splash generation
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#B5533B"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"

flutter_native_splash:
  color: "#B5533B" # terracotta brand background
  image: assets/icon/splash_logo.png
  android_12:
    color: "#B5533B"
    image: assets/icon/splash_logo.png
